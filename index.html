<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zygo AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <header>
      <h1>🤖 Zygo</h1>
      <p>Your simple AI assistant</p>
    </header>

    <main>
      <div id="chat">
        <div class="message bot">
          Hi! I'm Zygo. Ask me anything. 👋
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="userInput"
          placeholder="Ask Zygo something..."
        >

        <button onclick="sendMessage()">Send</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>

</body>
</html>
